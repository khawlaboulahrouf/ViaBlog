<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViaBlog</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 pb-24">

  <header class="flex items-center justify-between p-4" role="banner">
    <button class="text-2xl"><i class="fa-solid fa-bars"></i></button>
    <button class="text-xl"><i class="fa-solid fa-magnifying-glass"></i></button>
  </header>
<main class="min-h-screen pb-24">
  <h1 class="text-lg font-semibold p-6">Blogger Of The Week</h1>
    <section class="px-4">
      <div class="flex gap-3 overflow-x-auto pb-2">
        <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/15658164/pexels-photo-15658164.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Josefina</p>
        </div>
        <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/35709465/pexels-photo-35709465.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Francis</p>
        </div>
         <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/15658164/pexels-photo-15658164.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Francis</p>
        </div>
         <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/15658164/pexels-photo-15658164.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Francis</p>
        </div>
         <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/15658164/pexels-photo-15658164.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Francis</p>
        </div>
         <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/15658164/pexels-photo-15658164.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Francis</p>
        </div>
         <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/15658164/pexels-photo-15658164.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Francis</p>
        </div>
         <div class="text-center min-w-[70px]">
          <img src="https://images.pexels.com/photos/15658164/pexels-photo-15658164.jpeg"
            class="w-14 h-14 rounded-full mx-auto">
          <p class="text-xs mt-1">Francis</p>
        </div>
      </div>
    </section>

    <section class="px-4 mt-3">
      <h2 class="font-semibold mb-2">What Do You Want To Read?</h2>
      <div class="flex gap-2 overflow-x-auto pb-2">
        <button class="filterBtn bg-[#21B28F] text-white px-4 py-1 rounded-full" data-cat="All">All</button>
        <button class="filterBtn border px-4 py-1 rounded-full" data-cat="Forest">Forest</button>
        <button class="filterBtn border px-4 py-1 rounded-full" data-cat="Beach">Beach</button>
        <button class="filterBtn border px-4 py-1 rounded-full" data-cat="River">River</button>
        <button class="filterBtn border px-4 py-1 rounded-full" data-cat="Mountains">Mountains</button>
      </div>
    </section>

    <section class="px-4 mt-4">
      <div id="voyagesContainer" class="grid md:grid-cols-2 gap-4"></div>
    </section>

    <button id="openModal" class="fixed bottom-20 right-5 bg-[#21B28F] text-white px-4 py-2 rounded-full shadow-lg">
      + Create
    </button>
</main>
  

  <script src="app.js"></script>
</body>

</html>
